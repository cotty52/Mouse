################################################################################
# Application Configuration

CONFIG_DESKTOP_INIT_LOG_MOTION_EVENT=n
CONFIG_DESKTOP_INIT_LOG_HID_REPORT_EVENT=n
CONFIG_DESKTOP_INIT_LOG_HID_REPORT_SENT_EVENT=n
CONFIG_CAF_INIT_LOG_KEEP_ALIVE_EVENTS=n

CONFIG_DESKTOP_ROLE_HID_PERIPHERAL=y
CONFIG_DESKTOP_PERIPHERAL_TYPE_MOUSE=y
CONFIG_DESKTOP_DEVICE_PID=0x52DE
CONFIG_DESKTOP_HID_BOOT_INTERFACE_MOUSE=y

# Application supports 2 HID subscribers: HID over GATT (BLE) and a single USB HID instance
CONFIG_DESKTOP_HID_STATE_SUBSCRIBER_COUNT=2

# Note: DESKTOP_WHEEL_ENABLE is commented out in nrf_desktop_3/src/hw_interface/Kconfig.wheel
# Cannot enable wheel until Kconfig is fixed

# Use motion buttons for testing (no optical sensor on nice!nano)
CONFIG_DESKTOP_MOTION_BUTTONS_ENABLE=y
CONFIG_DESKTOP_MOTION_BUTTONS_UP_KEY_ID=0
CONFIG_DESKTOP_MOTION_BUTTONS_DOWN_KEY_ID=3
CONFIG_DESKTOP_MOTION_BUTTONS_LEFT_KEY_ID=2
CONFIG_DESKTOP_MOTION_BUTTONS_RIGHT_KEY_ID=1

CONFIG_CAF_BUTTONS=y
CONFIG_CAF_BUTTONS_POLARITY_INVERSED=y
CONFIG_CAF_BUTTONS_PM_KEEP_ALIVE=n

CONFIG_CAF_CLICK_DETECTOR=y

# Enable LEDs with PWM support
CONFIG_CAF_LEDS=y

# Disable hardware selector (not present)
# CONFIG_DESKTOP_SELECTOR_HW_ENABLE=n

CONFIG_DESKTOP_LED_STREAM_ENABLE=y

CONFIG_DESKTOP_BATTERY_CHARGER_DISCRETE=y

# Enable battery measurement with ADC
CONFIG_DESKTOP_BATTERY_MEAS=y
CONFIG_DESKTOP_BATTERY_MEAS_HAS_ENABLE_PIN=y
CONFIG_DESKTOP_BATTERY_MEAS_ENABLE_PIN=6
CONFIG_DESKTOP_BATTERY_MEAS_MIN_LEVEL=3100
CONFIG_DESKTOP_BATTERY_MEAS_MAX_LEVEL=4200
CONFIG_DESKTOP_BATTERY_MEAS_HAS_VOLTAGE_DIVIDER=y
CONFIG_DESKTOP_BATTERY_MEAS_VOLTAGE_DIVIDER_UPPER=1500
CONFIG_DESKTOP_BATTERY_MEAS_VOLTAGE_DIVIDER_LOWER=180
CONFIG_DESKTOP_VOLTAGE_TO_SOC_DELTA=10

CONFIG_DESKTOP_USB_ENABLE=y

CONFIG_DESKTOP_BLE_USE_DEFAULT_ID=y

CONFIG_DESKTOP_BLE_PEER_CONTROL=y
CONFIG_DESKTOP_BLE_PEER_CONTROL_BUTTON=0x0007
CONFIG_DESKTOP_BLE_PEER_SELECT=y
CONFIG_DESKTOP_BLE_PEER_ERASE=y

CONFIG_DESKTOP_BLE_DONGLE_PEER_ENABLE=y
CONFIG_DESKTOP_BLE_DONGLE_PEER_SELECTOR_ID=0
CONFIG_DESKTOP_BLE_DONGLE_PEER_SELECTOR_POS=0

CONFIG_DESKTOP_BLE_SECURITY_FAIL_TIMEOUT_S=10
# CONFIG_DESKTOP_BLE_LOW_LATENCY_LOCK=n  # Depends on CAF_BLE_USE_LLPM which requires SOC to be detected

CONFIG_DESKTOP_CONFIG_CHANNEL_ENABLE=y
CONFIG_DESKTOP_CONFIG_CHANNEL_OUT_REPORT=y
# Disable DFU - nice!nano uses Adafruit UF2 bootloader, not MCUboot/B0/SUIT
# DFU requires CONFIG_BOOTLOADER_MCUBOOT, CONFIG_SECURE_BOOT, or CONFIG_SUIT
# CONFIG_DESKTOP_CONFIG_CHANNEL_DFU_ENABLE=n

################################################################################
# Zephyr Configuration

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=1536
CONFIG_MAIN_STACK_SIZE=840
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_BT_HCI_TX_STACK_SIZE_WITH_PROMPT=y
CONFIG_BT_HCI_TX_STACK_SIZE=1536

CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

CONFIG_NUM_COOP_PRIORITIES=10
CONFIG_NUM_PREEMPT_PRIORITIES=11

CONFIG_HEAP_MEM_POOL_SIZE=1024

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_SYSTEM_CLOCK_NO_WAIT=y

# CONFIG_HW_STACK_PROTECTION=n  # Depends on ARCH_HAS_STACK_PROTECTION
CONFIG_RESET_ON_FATAL_ERROR=n

CONFIG_GPIO=y

CONFIG_REBOOT=y

CONFIG_SPEED_OPTIMIZATIONS=y

# Enable ADC for battery measurement
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_ADC_NRFX_SAADC=y

# Enable PWM for LED control
CONFIG_PWM=y

CONFIG_LED=y
CONFIG_LED_PWM=y

# Enable QDEC sensor for wheel
CONFIG_SENSOR=y
CONFIG_QDEC_NRFX=y

# SPI not needed (no optical sensor)
# CONFIG_SPI=n

CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_ID_MAX=6

# CONFIG_BT_CTLR_SDC_LLPM=n  # Depends on SOC_SERIES_NRF52X
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y

CONFIG_ENTROPY_CC3XX=n

# No PMW3360 optical sensor on nice!nano - using motion buttons instead
# CONFIG_PMW3360=n

CONFIG_FW_INFO=y
CONFIG_FW_INFO_FIRMWARE_VERSION=1

################################################################################

CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2

CONFIG_DESKTOP_LOG=y

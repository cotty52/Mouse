# Enable nRF Desktop
CONFIG_DESKTOP_ROLE_HID_PERIPHERAL=y

# Use Mouse as the peripheral type
CONFIG_DESKTOP_PERIPHERAL_TYPE_MOUSE=y
CONFIG_DESKTOP_DEVICE_PID=0x52DE
CONFIG_DESKTOP_HID_BOOT_INTERFACE_MOUSE=y

# Enable USB
CONFIG_DESKTOP_USB_ENABLE=y

# Application supports 2 HID subscribers: HID over GATT (BLE) and a single USB HID instance
CONFIG_DESKTOP_HID_STATE_SUBSCRIBER_COUNT=2

# Enable BLE
CONFIG_DESKTOP_BT=y

# BLE Peripheral Configuration - Standard mode (not dongle-specific)
# Note: USE_DEFAULT_ID requires BOND_ENABLE, so we keep it disabled
CONFIG_DESKTOP_BLE_PEER_CONTROL=n
CONFIG_DESKTOP_BLE_PEER_SELECT=n
CONFIG_DESKTOP_BLE_PEER_ERASE=n

# Disable bonding for initial testing
CONFIG_DESKTOP_BLE_BOND_ENABLE=n

# Disable dongle-specific peer pairing (we want to pair with Windows PC)
CONFIG_DESKTOP_BLE_DONGLE_PEER_ENABLE=n

CONFIG_DESKTOP_BLE_SECURITY_FAIL_TIMEOUT_S=10
CONFIG_DESKTOP_BLE_LOW_LATENCY_LOCK=n

# Security - Use Just Works pairing (no authentication required)
CONFIG_BT_SMP_ENFORCE_MITM=n
CONFIG_BT_SMP_SC_PAIR_ONLY=n
CONFIG_BT_BONDABLE=n
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# Enable buttons
CONFIG_CAF_BUTTONS=y
CONFIG_CAF_BUTTONS_POLARITY_INVERSED=y
CONFIG_CAF_BUTTONS_PM_KEEP_ALIVE=n

# Click detector for button events
CONFIG_CAF_CLICK_DETECTOR=y

# Use buttons for motion (temporary - until PMW3389 is integrated)
CONFIG_DESKTOP_MOTION_BUTTONS_ENABLE=n
# CONFIG_DESKTOP_MOTION_BUTTONS_UP_KEY_ID=0
# CONFIG_DESKTOP_MOTION_BUTTONS_DOWN_KEY_ID=1
# CONFIG_DESKTOP_MOTION_BUTTONS_LEFT_KEY_ID=2
# CONFIG_DESKTOP_MOTION_BUTTONS_RIGHT_KEY_ID=3

# Enable SPI
CONFIG_SPI=y

# Enable PMW3389 sensor (CPI is configured in app.overlay, not here)
# CONFIG_PMW3389=y

# Settings
CONFIG_SETTINGS=y
CONFIG_BT_ID_MAX=1
CONFIG_BT_MAX_PAIRED=1

CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# Enable BLE privacy for better Windows compatibility
CONFIG_BT_PRIVACY=n

################################################################################
# Zephyr Configuration

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=1536
CONFIG_MAIN_STACK_SIZE=840
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_BT_HCI_TX_STACK_SIZE_WITH_PROMPT=y
CONFIG_BT_HCI_TX_STACK_SIZE=1536

CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

CONFIG_NUM_COOP_PRIORITIES=10
CONFIG_NUM_PREEMPT_PRIORITIES=11

CONFIG_HEAP_MEM_POOL_SIZE=1024

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_SYSTEM_CLOCK_NO_WAIT=y

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

CONFIG_RESET_ON_FATAL_ERROR=n

CONFIG_GPIO=y
CONFIG_REBOOT=y

CONFIG_SPEED_OPTIMIZATIONS=y

# Bluetooth Low Latency Packet Mode (LLPM) for reduced latency
CONFIG_BT_CTLR_SDC_LLPM=n
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=n
CONFIG_BT_CTLR_PHY_2M=n

# Entropy/Random Number Generator
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_NRF5_RNG=y
CONFIG_ENTROPY_CC3XX=n

# Disable PSA Crypto automatic initialization to avoid linker error
# "Undefined initialization levels used" in nRF Connect SDK v3.1.1
CONFIG_PSA_CRYPTO_SYS_INIT=n

CONFIG_FW_INFO=y
CONFIG_FW_INFO_FIRMWARE_VERSION=1
CONFIG_DESKTOP_DEVICE_PRODUCT="nRF Mouse"
CONFIG_DESKTOP_DEVICE_MANUFACTURER="Christian"
CONFIG_DESKTOP_DEVICE_VID=0x1915
CONFIG_DESKTOP_BLE_ADV_CTRL_ENABLE=y
CONFIG_DESKTOP_BLE_ADV_CTRL_SUSPEND_ON_USB=n

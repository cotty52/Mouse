# nRF52840 DK – PMW3389 sensor debug configuration
#
# Purpose: Debug PMW3389 SPI communication and motion events using the DK's
#          built-in J-Link UART console.  Wire the PMW3389 to Arduino header
#          pins D8–D13 (see app.overlay for the pin table).
#
################################################################################
# Application Configuration

CONFIG_DESKTOP_INIT_LOG_MOTION_EVENT=n
CONFIG_DESKTOP_INIT_LOG_HID_REPORT_EVENT=n
CONFIG_DESKTOP_INIT_LOG_HID_REPORT_SENT_EVENT=n
CONFIG_CAF_INIT_LOG_KEEP_ALIVE_EVENTS=n

CONFIG_DESKTOP_ROLE_HID_PERIPHERAL=y
CONFIG_DESKTOP_PERIPHERAL_TYPE_MOUSE=y
CONFIG_DESKTOP_DEVICE_PID=0x52DE
CONFIG_DESKTOP_HID_BOOT_INTERFACE_MOUSE=y

# 2 HID subscribers: HID over GATT (BLE) + USB HID
CONFIG_DESKTOP_HID_STATE_SUBSCRIBER_COUNT=2

# Scroll wheel disabled (no encoder on DK)
CONFIG_DESKTOP_WHEEL_ENABLE=n

# ── PMW3389 Motion Sensor ────────────────────────────────────────────────
CONFIG_PMW3389=y
CONFIG_DESKTOP_MOTION_SENSOR_PMW3389_ENABLE=y
CONFIG_DESKTOP_MOTION_SENSOR_THREAD_STACK_SIZE=1536
CONFIG_DESKTOP_MOTION_SENSOR_EMPTY_SAMPLES_COUNT=500
CONFIG_DESKTOP_MOTION_SENSOR_CPI=1600

# ── DK Buttons ───────────────────────────────────────────────────────────
CONFIG_CAF_BUTTONS=y
CONFIG_CAF_BUTTONS_POLARITY_INVERSED=y
CONFIG_CAF_BUTTONS_PM_KEEP_ALIVE=n

CONFIG_CAF_CLICK_DETECTOR=y

# ── DK LEDs (4x PWM) ────────────────────────────────────────────────────
CONFIG_CAF_LEDS=y
CONFIG_CAF_LEDS_PWM=y
CONFIG_DESKTOP_LED_STREAM_ENABLE=y

# ── Not applicable to DK ────────────────────────────────────────────────
CONFIG_DESKTOP_SELECTOR_HW_ENABLE=n
CONFIG_DESKTOP_BATTERY_CHARGER_DISCRETE=n
CONFIG_DESKTOP_BATTERY_MEAS=n

# ── USB ──────────────────────────────────────────────────────────────────
CONFIG_DESKTOP_USB_ENABLE=y
CONFIG_DEPRECATION_TEST=y

# ── Bluetooth ────────────────────────────────────────────────────────────
CONFIG_DESKTOP_BLE_USE_DEFAULT_ID=y
CONFIG_DESKTOP_BLE_ADV_CTRL_ENABLE=y
CONFIG_DESKTOP_BLE_LOW_LATENCY_LOCK=y

CONFIG_DESKTOP_BLE_PEER_CONTROL=y
CONFIG_DESKTOP_BLE_PEER_CONTROL_BUTTON=0x0000
CONFIG_DESKTOP_BLE_PEER_ERASE_ON_START=y

CONFIG_DESKTOP_BLE_SECURITY_FAIL_TIMEOUT_S=10

CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_ID_MAX=3

CONFIG_BT_CTLR_SDC_LLPM=y
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y

CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_BT_HCI_TX_STACK_SIZE_WITH_PROMPT=y
CONFIG_BT_HCI_TX_STACK_SIZE=1536

# ── Config channel ──────────────────────────────────────────────────────
CONFIG_DESKTOP_CONFIG_CHANNEL_ENABLE=y
CONFIG_DESKTOP_CONFIG_CHANNEL_OUT_REPORT=y
CONFIG_DESKTOP_CONFIG_CHANNEL_DFU_ENABLE=y

################################################################################
# Zephyr Configuration

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=1536
CONFIG_MAIN_STACK_SIZE=840

CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

CONFIG_NUM_COOP_PRIORITIES=10
CONFIG_NUM_PREEMPT_PRIORITIES=15

CONFIG_HEAP_MEM_POOL_SIZE=1024

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_SYSTEM_CLOCK_NO_WAIT=y

CONFIG_HW_STACK_PROTECTION=y
CONFIG_RESET_ON_FATAL_ERROR=n

CONFIG_GPIO=y
CONFIG_REBOOT=y
CONFIG_SPEED_OPTIMIZATIONS=y

CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y
CONFIG_LED_GPIO=n

CONFIG_SENSOR=y

CONFIG_SPI=y
CONFIG_SPI_NRFX=y
CONFIG_SPI_NRFX_RAM_BUFFER_SIZE=8

CONFIG_ENTROPY_CC3XX=n

CONFIG_FW_INFO=y
CONFIG_FW_INFO_FIRMWARE_VERSION=1

################################################################################
# Debug Logging (DK J-Link UART → /dev/ttyACM*)

CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2

CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# PMW3389 driver: level 4 = DBG (init steps, product ID, SPI errors)
CONFIG_PMW3389_LOG_LEVEL=4

# Motion module: state transitions, trigger flow
CONFIG_DESKTOP_MOTION_LOG_LEVEL_DBG=y

# BLE: advertising, connections, bonds
CONFIG_DESKTOP_BLE_ADV_CTRL_LOG_LEVEL_DBG=y
CONFIG_DESKTOP_BLE_BOND_LOG_LEVEL_DBG=y
CONFIG_BT_LOG_LEVEL_WRN=y

# Buttons: press / release events
CONFIG_CAF_BUTTONS_LOG_LEVEL_DBG=y

# General desktop log
CONFIG_DESKTOP_LOG=y

# Power manager disabled for debugging
CONFIG_DESKTOP_POWER_MANAGER=n

# Available runners configured by board.cmake.
runners:
- nrfutil
- nrfjprog
- jlink

# Default flash runner if --runner is not given.
flash-runner: nrfutil

# Default debug runner if --runner is not given.
debug-runner: jlink

# Common runner configuration values.
config:
  board_dir: C:/ncs/v3.1.1/nrf/boards/nordic/nrf52840gmouse
  # Build outputs:
  elf_file: zephyr.elf
  hex_file: D:/GitHub/Mouse/Software/broadcaster/build/merged.hex
  bin_file: zephyr.bin
  uf2_file: zephyr.uf2
  # Host tools:
  gdb: C:/ncs/toolchains/c1a76fddb2/opt/zephyr-sdk/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb.exe

# Runner specific arguments
args:
  nrfutil:
    - --nrf-family=NRF52
  nrfjprog:
    - --softreset
  jlink:
    - --dt-flash=y
    - --device=nRF52840_xxAA
    - --speed=4000
